spring.application.name=emailService
server.port=8081
#Mysql configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.servlet.context-path=/app/v1

#JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

#Email configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${MAIL_FROM_EMAIL}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
kafka.topic.email=email-events

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.emailService.event,com.be9expensphie.expensphie_backend.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.emailService.event.EmailEvent
spring.kafka.consumer.group-id=email-id
spring.kafka.consumer.auto-offset-reset=earliest

# --- Actuator / Prometheus metrics ---
# The management server listens on its own port, which docker-compose never
# publishes, so /actuator is reachable only from inside the compose network.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
# Server-side histogram buckets, so Grafana can compute true p95/p99 rather
# than averaging pre-computed percentiles across instances.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Dedup ---
# EmailConsumer remembers each eventId it has sent. The window only has to
# outlive redelivery -- Kafka retention plus four retry attempts -- so a row
# older than this can never be matched again.
app.dedup.retention-days=14
app.dedup.cleanup-cron=0 30 3 * * *
